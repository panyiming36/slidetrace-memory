[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slidetrace-memory"
version = "0.1.0"
description = "Persistent, scoped preference memory for presentation applications"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["tiktoken>=0.7,<1"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["slidetrace_memory*"]
